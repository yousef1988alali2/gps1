name: build
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: yes | sdkmanager --licenses > /dev/null || true
      - run: unzip -o project*.zip -d proj
      - run: cd proj && gradle assembleDebug --no-daemon
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GpsBridge
          files: proj/app/build/outputs/apk/debug/app-debug.apk
